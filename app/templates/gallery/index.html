{% extends "gallery/base-gallery.html" %}
{% block title %}컬렉션{% endblock %}

{% block content %}
<section class="gallery-toolbar">
  <div class="toolbar-container">
    <div class="toolbar-left">
      <h1 class="page-title">갤러리 컬렉션</h1>
      <p class="page-sub">모든 순간의 기록들</p>
    </div>
    <div class="toolbar-right">
      <div class="filter-group">
        <label for="yearFilter" class="filter-label"><i class="fa-solid fa-calendar-days"></i> 연도별 필터</label>
        <div class="select-wrapper">
          <select id="yearFilter" class="input-control gallery-select" aria-label="연도 선택">
            <option value="all">전체 사진</option>
            {% for y in years %}
              <option value="{{ y }}">{{ y }}년</option>
            {% endfor %}
          </select>
          <span class="select-arrow"><i class="fa-solid fa-chevron-down"></i></span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="masonry" id="masonry">
  <div class="masonry-sizer" aria-hidden="true"></div>
  <div class="masonry-gutter" aria-hidden="true"></div>
  {% for photo in photos %}
    <a class="photo-card"
       href="{{ url_for('gallery.detail', filename=photo.id) }}"
       data-id="{{ photo.id }}"
       data-url="{{ photo.url }}"
       data-title="{{ photo.title|e }}"
       data-year="{{ photo.year }}"
       data-tags="{{ (photo.tags|join(',')) if photo.tags else '' }}"
       data-exif='{{ photo.exif_low|tojson }}'>
      <figure class="card-figure">
        <img src="{{ photo.thumbnail_url or photo.url }}"
             alt="{{ photo.title }}"
             loading="{{ 'eager' if loop.index <= 8 else 'lazy' }}"
             {% if loop.first %}fetchpriority="high"{% endif %}>
        <figcaption class="card-caption">
          <span class="title"></span>
          <span class="meta">
            {% if photo.tags %}{{ photo.tags|join(', ') }}{% endif %}
          </span>
        </figcaption>
      </figure>
    </a>
  {% else %}
    <p class="empty-state">표시할 사진이 없습니다.</p>
  {% endfor %}
</section>

<div id="glightbox" class="glightbox photo-viewer photo-viewer--modal" data-photo-viewer hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="사진 보기" tabindex="-1">
  <header class="photo-viewer__topbar">
    <button type="button" class="btn btn-invisible btn-sm photo-viewer__back" data-action="close">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      <span>갤러리</span>
    </button>

    <span id="glbx-counter" class="photo-viewer__counter" aria-live="polite"></span>

    <div class="photo-viewer__tools">
      <button type="button" class="btn btn-invisible btn-sm photo-viewer__info-toggle" data-action="toggle-info" aria-expanded="false">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <span>정보</span>
      </button>
      <button type="button" class="btn btn-invisible btn-sm" data-action="fullscreen" aria-label="전체 화면으로 보기">
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
        <span class="photo-viewer__tool-label">전체 화면</span>
      </button>
      <button type="button" class="btn btn-invisible btn-sm photo-viewer__close" data-action="close" aria-label="사진 보기 닫기">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="photo-viewer__layout">
    <section class="photo-viewer__stage" aria-label="사진 영역">
      <button type="button" class="btn btn-invisible btn-sm photo-viewer__nav photo-viewer__nav--prev" data-action="previous" aria-label="이전 사진">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <img id="glbx-img" class="photo-viewer__image" alt="" draggable="false">
      <button type="button" class="btn btn-invisible btn-sm photo-viewer__nav photo-viewer__nav--next" data-action="next" aria-label="다음 사진">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </section>

    <aside class="photo-viewer__panel" aria-label="사진 정보" aria-live="polite">
      <div class="photo-viewer__panel-header">
        <p class="photo-viewer__eyebrow">PHOTO INFORMATION</p>
        <button type="button" class="btn btn-invisible btn-sm photo-viewer__panel-close" data-action="toggle-info" aria-label="사진 정보 닫기">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <h1 id="glbx-title" class="photo-viewer__title"></h1>
      <dl id="glbx-meta" class="photo-viewer__meta"></dl>
    </aside>
  </div>
</div>
{% endblock %}
